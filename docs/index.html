<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen Buddy</title>
<meta name="description" content="A pixel companion that lives on top of your Android screen.">
<style>
  :root { --bg: #faf7f2; --text: #1d1915; --muted: #6b6259; --accent: #8a6a2c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0d0b; --text: #f3ece0; --muted: #a0968a; --accent: #d4b06a; }
  }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.65 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 72px 20px; }
  .eyebrow { color: var(--accent); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 44px; margin: 8px 0 12px; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Android app</div>
  <h1>Screen Buddy</h1>
  <p>A pixel cat who lives on top of your screen. She strolls along the bottom edge, grooms,
  naps, hops onto your keyboard and chases a ball of wool now and then. Pet her, carry her and
  toss her around.</p>
  <p><a href="privacy-policy.html">Privacy policy</a></p>
</main>
</body>
</html>
